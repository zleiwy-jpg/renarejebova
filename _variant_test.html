<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="typography.css">
<link rel="stylesheet" href="visual.css">
<style>
#b { background: linear-gradient(100deg, #ffe3b6, #ff9800 42%, #ffe3b6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
#c { background-image: linear-gradient(100deg, #ffe3b6, #ff9800 42%, #ffe3b6); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
#d { background: linear-gradient(100deg, #ffe3b6, #ff9800 42%, #ffe3b6); }
</style>
</head>
<body>
<h3 class="busy-title" id="a">A</h3>
<h3 id="b">B</h3>
<h3 id="c">C</h3>
<h3 id="d">D</h3>
<script>
const rows = ["a","b","c","d"].map(id => {
  const cs = getComputedStyle(document.getElementById(id));
  return id + ": bgImage=" + cs.backgroundImage.slice(0,40) + " | clip=" + cs.backgroundClip + " | fill=" + cs.getPropertyValue("-webkit-text-fill-color") + " | color=" + cs.color;
});
const pre = document.createElement("pre");
pre.textContent = "DIAG-START\n" + rows.join("\n") + "\nDIAG-END";
document.body.append(pre);
</script>
</body>
</html>
