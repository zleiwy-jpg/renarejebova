<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="typography.css">
<link rel="stylesheet" href="visual.css">
<style>body{margin:0;background:#ff00ff;padding:20px}</style>
</head>
<body>
<h3 class="busy-title" id="t">VALEH ÜZƏRİNDƏ İŞLƏYİR</h3>
<script>
const el = document.getElementById("t");
const cs = getComputedStyle(el);
const out = [
  "color=" + cs.color,
  "textFill=" + (cs.webkitTextFillColor || cs.getPropertyValue("-webkit-text-fill-color")),
  "bgImage=" + cs.backgroundImage.slice(0, 60),
  "bgClip=" + (cs.backgroundClip || cs.webkitBackgroundClip),
  "webkitBgClip=" + cs.getPropertyValue("-webkit-background-clip"),
  "font=" + cs.font,
  "fontSize=" + cs.fontSize
].join("\n");
const pre = document.createElement("pre");
pre.id = "diagout";
pre.textContent = "DIAG-START\n" + out + "\nDIAG-END";
document.body.append(pre);
</script>
</body>
</html>
